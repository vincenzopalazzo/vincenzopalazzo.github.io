<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
  <meta name="description" content="Vincenzo Palazzo — open-source software engineer. Bitcoin, Lightning & Rust. Brink grantee and Core Lightning contributor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  %sveltekit.head%
</head>
<body data-mode="editorial" data-sveltekit-preload-data="hover">
  <script>
    // Set the mode (and thus background) before paint so a returning
    // nerd-mode visitor never sees a light flash on load.
    try {
      document.body.dataset.mode =
        localStorage.getItem('vp-nerd') === '1' ? 'terminal' : 'editorial';
    } catch (e) {}
  </script>
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
